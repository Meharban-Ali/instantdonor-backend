version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      spring-dependencies:
        patterns:
          - "org.springframework*"
      test-dependencies:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.testcontainers*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
