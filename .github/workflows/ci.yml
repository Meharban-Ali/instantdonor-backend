name: Backend CI / CD Pipeline

on:
  push:
    branches: [ "main", "master", "chore/**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build, Test & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Docker Buildx (for Testcontainers & Docker Build)
        uses: docker/setup-buildx-action@v3

      - name: Compile and Run Tests (with Testcontainers MySQL & Redis)
        run: |
          mvn clean test \
            -Dtest="!RealDatabasePhase5LoadTest" \
            --batch-mode \
            --no-transfer-progress

      - name: Run OWASP Dependency-Check Security Audit
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=8 \
            -Dformat=HTML \
            --batch-mode \
            --no-transfer-progress
        continue-on-error: true

      - name: Upload OWASP Dependency-Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-report
          path: target/dependency-check-report.html

      - name: Build Docker Container Image
        run: |
          docker build -t blood-donor-backend:${{ github.sha }} .
          docker tag blood-donor-backend:${{ github.sha }} blood-donor-backend:latest
