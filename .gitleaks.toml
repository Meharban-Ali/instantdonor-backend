# Gitleaks configuration
title = "Blood Donor Network Backend Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for benign test fixtures and documentation"
paths = [
  '''^\.env\.example$''',
  '''^src/test/resources/.*''',
  '''^target/.*''',
  '''^HELP\.md$'''
]

stopwords = [
  "testpass",
  "secret",
  "testuser",
  "test-ai-key",
  "placeholder"
]
