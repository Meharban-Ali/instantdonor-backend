version: '3.8'

# ============================================================
# DOCKER ORCHESTRATION - PRODUCTION READY ARCHITECTURE
# ============================================================

services:
  # ----------------------------
  # 1. MySQL Database Service
  # ----------------------------
  mysql:
    image: mysql:8.0
    container_name: blood_donor_mysql
    restart: always
    ports:
      - "3307:3306" # Mapped to host 3307 to avoid conflict with native MySQL on host
    environment:
      MYSQL_ROOT_PASSWORD: "12345"
      MYSQL_DATABASE: "blood_donor_db_dev"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - blood_donor_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p12345"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------
  # 2. Redis Caching Service
  # ----------------------------
  redis:
    image: redis:7-alpine
    container_name: blood_donor_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass 12345
    volumes:
      - redis_data:/data
    networks:
      - blood_donor_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "12345", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------
  # 3. AI Service (Python FastAPI)
  # ----------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: blood_donor_ai_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - DB_URL=mysql+pymysql://root:12345@mysql:3306/blood_donor_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=12345
      - SPRING_BOOT_URL=http://backend:8090
      - JWT_SECRET=BloodDonorNetworkSecretKey2024ForLocalDevOnly123456
      - CORS_ORIGINS=["http://localhost:3000", "http://localhost:8090", "http://localhost:5173"]
    networks:
      - blood_donor_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------
  # 4. Backend Service (Spring Boot)
  # ----------------------------
  backend:
    build:
      context: ./Backend/AiBloodDonorWebApplication_Backend
      dockerfile: Dockerfile
    container_name: blood_donor_backend
    restart: always
    ports:
      - "8090:8090"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - PORT=8090
      - DB_URL=jdbc:mysql://mysql:3306/blood_donor_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DB_USERNAME=root
      - DB_PASSWORD=12345
      - REPLICA_DB_URL=jdbc:mysql://mysql:3306/blood_donor_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - REPLICA_DB_USERNAME=root
      - REPLICA_DB_PASSWORD=12345
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=12345
      - AI_SERVICE_URL=http://ai-service:8000
      - FRONTEND_URL=http://localhost:3000
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
    networks:
      - blood_donor_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------
  # 5. Frontend Service (React + Nginx)
  # ----------------------------
  frontend:
    build:
      context: ./Frontend/ai-blood-donor-ui
      dockerfile: Dockerfile
    container_name: blood_donor_frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - blood_donor_network
    depends_on:
      - backend

# ============================================================
# VOLUMES & NETWORKS SPECIFICATIONS
# ============================================================

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  blood_donor_network:
    driver: bridge