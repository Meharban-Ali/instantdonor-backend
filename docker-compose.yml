# ══════════════════════════════════════════════════════════════
# DOCKER COMPOSE - PRODUCTION-READY ARCHITECTURE
# ══════════════════════════════════════════════════════════════

services:
  # ────────────────────────────────────────────────────────────
  # 1. MySQL 8 Database Service
  # ────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0.36
    container_name: blood_donor_mysql
    restart: unless-stopped
    ports:
      - "${HOST_DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-RootPass_ChangeMe_123!}
      MYSQL_DATABASE: ${DB_NAME:-blood_donor_db}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      blood_donor_net:
        aliases:
          - mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ────────────────────────────────────────────────────────────
  # 2. Redis 7 Cache & Rate Limiting Service
  # ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: blood_donor_redis
    restart: unless-stopped
    ports:
      - "${HOST_REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass "${REDIS_PASSWORD:-12345}" --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-12345}
    volumes:
      - redis_data:/data
    networks:
      blood_donor_net:
        aliases:
          - redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-12345} ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────────────
  # 3. Spring Boot Backend Service
  # ────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blood_donor_backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env.example
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - PORT=8080
      - SERVER_PORT=8080
      - DB_URL=jdbc:mysql://mysql:3306/${DB_NAME:-blood_donor_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-RootPass_ChangeMe_123!}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-12345}
      - JWT_SECRET=${JWT_SECRET:-ThisIsADefaultProductionSecretKeyWithAtLeastFortyEightBytesForSha384!}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@StrongPass123!}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-service:8000}
      - RATE_LIMITING_ENABLED=${RATE_LIMITING_ENABLED:-true}
      - RATE_LIMITING_CAPACITY=${RATE_LIMITING_CAPACITY:-1000}
      - RATE_LIMITING_LOGIN_IP_CAPACITY=${RATE_LIMITING_LOGIN_IP_CAPACITY:-1000}
      - RATE_LIMITING_LOGIN_EMAIL_CAPACITY=${RATE_LIMITING_LOGIN_EMAIL_CAPACITY:-500}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blood_donor_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ────────────────────────────────────────────────────────────
  # 4. AI Matching Service (Optional / Placeholder)
  # ────────────────────────────────────────────────────────────
  ai-service:
    image: python:3.11-slim
    container_name: blood_donor_ai_placeholder
    restart: unless-stopped
    profiles:
      - ai-optional
    ports:
      - "8000:8000"
    command: >
      python -c '
      from http.server import HTTPServer, BaseHTTPRequestHandler
      import json

      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              if self.path == "/health":
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(b"{\"status\":\"UP\"}")
              else:
                  self.send_response(404)
                  self.end_headers()

          def do_POST(self):
              self.send_response(200)
              self.send_header("Content-Type", "application/json")
              self.end_headers()
              self.wfile.write(b"{\"totalFound\":0,\"donors\":[]}")

      server = HTTPServer(("0.0.0.0", 8000), Handler)
      print("AI matching service running on port 8000...")
      server.serve_forever()
      '
    networks:
      - blood_donor_net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ────────────────────────────────────────────────────────────
  # 5. Nginx Reverse Proxy Service
  # ────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: blood_donor_nginx
    restart: unless-stopped
    ports:
      - "${HOST_NGINX_PORT:-8088}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      blood_donor_net:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

# ══════════════════════════════════════════════════════════════
# VOLUMES & NETWORKS
# ══════════════════════════════════════════════════════════════
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  blood_donor_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16