services:
  # ─── Spring Boot Backend Web Service ──────────────────────────────────────────
  - type: web
    name: blood-donor-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 10000
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_MAX
        value: "10"
      - key: DB_POOL_MIN_IDLE
        value: "2"
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: JWT_REFRESH_EXPIRATION
        value: "604800000"
      - key: FRONTEND_URL
        value: https://instantdonor.online
      - key: CORS_ALLOWED_ORIGINS
        value: https://instantdonor.online,https://www.instantdonor.online
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_API_KEY
        sync: false
      - key: MAIL_HOST
        value: smtp.resend.com
      - key: MAIL_PORT
        value: "2587"
      - key: MAIL_USERNAME
        value: resend
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: "AI Blood Donor Network"
      - key: MAIL_REPLY_TO
        sync: false
      - key: FLYWAY_DB_URL
        sync: false
      - key: ADMIN_EMAIL
        value: "admin@blooddonor.com"
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: "Platform Administrator"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
