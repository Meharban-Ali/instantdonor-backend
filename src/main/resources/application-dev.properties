# ============================================
# DEVELOPMENT PROFILE - CLEAN VERSION
# ============================================

server.port=8090

server.error.include-message=always
server.error.include-stacktrace=always

# ============================================
# DATABASE
# ============================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/${DB_NAME:blood_donor_db_dev}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=DevHikariPool

# ============================================
# JPA (SAFE DEV MODE)
# ============================================

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=false

spring.jpa.properties.hibernate.format_sql=true

# Reduce noise (IMPORTANT)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# ============================================
# FLYWAY
# ============================================

spring.flyway.enabled=false

# ============================================
# REDIS (OPTIONAL SAFE MODE)
# ============================================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.cache.type=redis

# ============================================
# LOGGING
# ============================================

logging.level.com.blood_donor=DEBUG
logging.level.org.springframework.web=DEBUG
logging.file.path=logs

# ============================================
# SECURITY (DEV RELAXED)
# ============================================

cors.allowed-origins=http://localhost:3000,http://localhost:5173

rate-limiting.enabled=${RATE_LIMITING_ENABLED:true}

# ============================================
# AI SERVICE
# ============================================

# Unused ai.service.url removed. Configured via app.ai-service.url in base properties.

# ============================================
# NOTIFICATIONS DISABLED
# ============================================

notification.sms.enabled=false
notification.email.enabled=false
notification.push.enabled=false

# ============================================
# DEVTOOLS
# ============================================

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ============================================
# ACTUATOR (SAFE DEV EXPOSURE)
# ============================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ============================================
# METRICS
# ============================================

management.metrics.export.prometheus.enabled=false

# ============================================
# SESSION
# ============================================

server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true

# Force Hibernate schema update and correct Hikari catalog in dev
spring.datasource.hikari.catalog=${DB_NAME:blood_donor_db_dev}
spring.jpa.properties.hibernate.hbm2ddl.auto=update