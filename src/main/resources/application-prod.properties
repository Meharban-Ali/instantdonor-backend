# ═══════════════════════════════════════════════
# PRODUCTION PROFILE
# Active: java -jar app.jar --spring.profiles.active=prod
# ═══════════════════════════════════════════════

# ── Database ─────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Production: validate only — schema managed by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Hikari Connection Pool — production tuned (Neon Serverless scale-to-zero compatible)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.data-source-properties.prepareThreshold=${DB_PREPARE_THRESHOLD:0}
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=0

# ── Flyway Migrations ─────────────────────────
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.url=${FLYWAY_DB_URL:${DB_URL}}
spring.flyway.user=${FLYWAY_DB_USERNAME:${DB_USERNAME}}
spring.flyway.password=${FLYWAY_DB_PASSWORD:${DB_PASSWORD}}

# ── Redis (Lettuce) ───────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=3000ms
spring.data.redis.lettuce.shutdown-timeout=2000ms
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5

# ── JWT Security ──────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ── Email ─────────────────────────────────────
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:587}}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
app.mail.from-name=${MAIL_FROM_NAME:Blood Donor Network}
app.mail.from-address=${MAIL_FROM_ADDRESS:noreply@blooddonor.com}
app.mail.reply-to=${MAIL_REPLY_TO:}

# ── Twilio SMS ────────────────────────────────
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.phone-number=${TWILIO_PHONE_NUMBER:}
app.twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}
app.twilio.enabled=${TWILIO_ENABLED:false}
app.notification.sms.max-per-donor-per-day=${APP_NOTIFICATION_SMS_MAX_PER_DONOR_PER_DAY:3}
app.notification.sms.global-daily-cap=${APP_NOTIFICATION_SMS_GLOBAL_DAILY_CAP:500}

# ── Server & Tomcat (512MB RAM Tuned) ─────────
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=50
server.tomcat.max-connections=1000
server.tomcat.connection-timeout=20000ms
server.max-http-request-header-size=8KB
server.tomcat.max-http-form-post-size=2MB
server.tomcat.max-swallow-size=2MB
spring.servlet.multipart.enabled=false
server.compression.enabled=true
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.internal-proxies=10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|169\\.254\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1|172\\.28\\.0\\.10

# ── Security & Session ────────────────────────
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# ── Swagger & H2 OFF in Production ────────────
spring.h2.console.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ── Actuator Observability ────────────────────
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.exposure.exclude=env,threaddump,heapdump,configprops,shutdown
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.liveness.include=diskSpace,ping
management.endpoint.health.group.readiness.include=db,redis
management.endpoint.metrics.enabled=true
management.info.build.enabled=true
management.info.git.enabled=true
management.info.git.mode=full

# ── Logging ───────────────────────────────────
logging.level.root=WARN
logging.level.com.blood_donor=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId}] - %msg%n

# ── AI Service & Frontend ─────────────────────
app.ai-service.url=${AI_SERVICE_URL:http://ai-service:8000}
app.ai-service.timeout=8000
app.ai-service.api-key=${AI_SERVICE_API_KEY:}
app.frontend.url=${FRONTEND_URL}

# ── App Properties ────────────────────────────
app.reset-token.expiry-minutes=30
app.notification.max-donors-to-notify=10
app.notification.enabled=true