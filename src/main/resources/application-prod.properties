# ═══════════════════════════════════════════════
# PRODUCTION PROFILE
# Active: java -jar app.jar --spring.profiles.active=prod
# ═══════════════════════════════════════════════

# ── Database ─────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Production: validate only — no auto-changes
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection pool — production tuned
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── Redis ─────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5

# ── Email ─────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Swagger OFF in production ─────────────────
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ── Logging — minimal in production ──────────
logging.level.root=WARN
logging.level.com.blooddonor=INFO
logging.level.org.hibernate.SQL=WARN
logging.file.name=/app/logs/blooddonor.log
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ── Server Tomcat — production tuned ─────────
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=50
server.tomcat.accept-count=200
server.compression.enabled=true

# ── Security Headers ──────────────────────────
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# ── AI Service ────────────────────────────────
app.ai-service.url=${AI_SERVICE_URL:http://ai-service:8000}
app.ai-service.timeout=8000
app.frontend.url=${FRONTEND_URL}

# ── Token ─────────────────────────────────────
app.reset-token.expiry-minutes=30
app.notification.max-donors-to-notify=10
app.notification.enabled=true