# ============================================
# STAGING PROFILE (Pre-Production)
# ============================================
spring.profiles.active=staging

# Server
server.port=8080
server.compression.enabled=true

# Database (Staging DB)
spring.datasource.url=${DB_URL:${STAGING_DB_URL}}
spring.datasource.username=${DB_USERNAME:${STAGING_DB_USER}}
spring.datasource.password=${DB_PASSWORD:${STAGING_DB_PASSWORD}}
spring.datasource.hikari.maximum-pool-size=20

# JPA (Warn only)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=true

# Redis (Staging)
spring.data.redis.host=${REDIS_HOST:${STAGING_REDIS_HOST}}
spring.data.redis.password=${REDIS_PASSWORD:${STAGING_REDIS_PASSWORD}}

# Logging
logging.level.com.blooddonor=INFO
logging.level.org.springframework.web=WARN

# Rate Limiting (Enabled)
rate-limiting.enabled=true
rate-limiting.max-requests-per-minute=50

# CORS (Staging domains)
cors.allowed-origins=https://staging.blooddonor.com

# Monitoring
management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.export.prometheus.enabled=true

# Cache (30 min TTL)
spring.cache.redis.time-to-live=1800000

# SSL (Enabled)
server.ssl.enabled=true