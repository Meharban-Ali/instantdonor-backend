# ============================================
# BLOOD DONOR NETWORK - PRODUCTION CONFIGURATION
# ============================================
# Version: 1.0.0-PRODUCTION
# Profile: base (extends by dev/prod)
# ============================================

# ============================================
# APPLICATION METADATA
# ============================================
spring.application.name=blood-donor-network
spring.application.version=1.0.0
spring.application.description=AI-Powered Emergency Blood Donor Matching System
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
# Existing file mein ye line add karo:

# Frontend URL — Password reset email mein link ke liye
# ─── Password Reset Token ────────────────────
app.reset-token.expiry-minutes=30

# ─── Frontend URL (Password Reset Email Link) ─
app.frontend.url=http://localhost:5173
# Production mein:
# app.frontend.url=https://your-domain.com


# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=${PORT:8080}
server.shutdown=graceful
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=never
server.error.path=/error
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.context-path=/

# Forwarded Headers & Trusted Proxy Configuration
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.internal-proxies=127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|172\\.28\\.0\\.10

# HTTP/2 Support
server.http2.enabled=true

# Compression (Gzip)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=2048

# SSL Configuration (Production)
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:classpath:keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${SSL_KEY_ALIAS:tomcat}

# ============================================
# UNDERTOW CONFIGURATION (Performance)
# ============================================
server.undertow.accesslog.enabled=true
server.undertow.accesslog.pattern=combined
server.undertow.accesslog.dir=/var/log/blood-donor/access
server.undertow.io-threads=16
server.undertow.worker-threads=256
server.undertow.buffer-size=16384
server.undertow.direct-buffers=true
server.undertow.eager-filter-init=true
server.undertow.max-http-post-size=10MB

# Connection Limits
server.undertow.server.max-connections=10000
server.undertow.server.max-http-header-size=32768
server.undertow.server.request-parse-timeout=5000

# ============================================
# DATASOURCE - PRODUCTION OPTIMIZED
# ============================================
# PostgreSQL / Neon Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/${DB_NAME:blood_donor_db}}
spring.datasource.username=${DB_USERNAME:blooddonor_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# HikariCP Connection Pool (Neon Serverless Optimized)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:${DB_MAX_POOL_SIZE:20}}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:${DB_MIN_IDLE:0}}
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.pool-name=BloodDonorHikariPool
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.leak-detection-threshold=20000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.register-mbeans=true
spring.datasource.hikari.allow-pool-suspension=false
spring.datasource.hikari.connection-init-sql=SELECT 1
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
spring.datasource.hikari.data-source-properties.prepareThreshold=${DB_PREPARE_THRESHOLD:0}
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=0

# Read Replica Configuration (Optional)
spring.datasource.replica.url=${REPLICA_DB_URL:jdbc:postgresql://localhost:5432/blood_donor_db}
spring.datasource.replica.username=${REPLICA_DB_USERNAME:blooddonor_replica}
spring.datasource.replica.password=${REPLICA_DB_PASSWORD:}

# ============================================
# JPA & HIBERNATE - PRODUCTION OPTIMIZED
# ============================================
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=none

# Hibernate Performance Tuning
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# Second Level Cache (Disabled due to missing jcache region factory)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.session.events.log=ERROR

# Connection Pool Settings
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.connection.autocommit=false

# Query Performance
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=256
spring.jpa.properties.hibernate.query.startup_check=false

# Lazy Loading
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.max_fetch_depth=3

# Spatial Support for Location Queries
spring.jpa.properties.hibernate.integration.spatial.enabled=true

# ============================================
# FLYWAY DATABASE MIGRATION
# ============================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.encoding=UTF-8
spring.flyway.connect-retries=10

# ============================================
# REDIS CACHE CONFIGURATION
# ============================================
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# Lettuce Connection Pool (High Performance)
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=2000ms
spring.data.redis.lettuce.shutdown-timeout=200ms

# Redis Client Configuration
spring.data.redis.client-type=lettuce
spring.data.redis.database=0

# ============================================
# CACHE CONFIGURATION
# ============================================
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=blood-donor:cache:
spring.cache.redis.cache-manager-transaction-aware=true

# Caffeine Local Cache (Backup)
spring.cache.caffeine.spec=maximumSize=10000,expireAfterAccess=3600s

# ============================================
# SECURITY CONFIGURATION
# ============================================
# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
jwt.issuer=blood-donor-network
jwt.audience=blood-donor-api

# Password Encryption
spring.security.password.encoder.bcrypt.strength=12
spring.security.user.name=monitor
spring.security.user.password=${MONITOR_PASSWORD:}
spring.security.user.roles=MONITOR

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${CORS_ORIGINS:https://blooddonor.com,https://api.blooddonor.com}}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type,X-Requested-With
cors.exposed-headers=Authorization
cors.allow-credentials=true
cors.max-age=3600

# Rate Limiting
rate-limiting.enabled=${RATE_LIMITING_ENABLED:true}
rate-limiting.capacity=${RATE_LIMITING_CAPACITY:100}
rate-limiting.login.ip-capacity=${RATE_LIMITING_LOGIN_IP_CAPACITY:10}
rate-limiting.login.email-capacity=${RATE_LIMITING_LOGIN_EMAIL_CAPACITY:5}
rate-limiting.refill-interval=${RATE_LIMITING_REFILL_INTERVAL:60}
rate-limiting.max-requests-per-minute=${RATE_LIMITING_MAX_REQUESTS:100}

# ============================================
# AI SERVICE CONFIGURATION
# ============================================
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.timeout=5000
ai.service.max-retries=3
ai.service.connection-pool-size=10
ai.matching.batch-size=50
ai.matching.cache-ttl=120
ai.demand-prediction.enabled=true

# ============================================
# WEB CLIENT CONFIGURATION
# ============================================
spring.webclient.max-connections=500
spring.webclient.max-idle-time=30000
spring.webclient.response-timeout=10000

# ============================================
# NOTIFICATION SERVICE
# ============================================
# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# SMS (Twilio)
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}

# Push Notifications (Firebase)
fcm.service-account-file=${FCM_SERVICE_ACCOUNT:classpath:firebase-service-account.json}
fcm.project-id=${FCM_PROJECT_ID:}

# ============================================
# WEBSOCKET CONFIGURATION
# ============================================
spring.websocket.message-broker.enabled=true
spring.websocket.message-broker.simple-prefix=/topic
spring.websocket.message-broker.application-prefix=/app
spring.websocket.message-broker.client-prefix=/user
spring.websocket.message-broker.relay-host=${BROKER_HOST:localhost}
spring.websocket.message-broker.relay-port=61613

# ============================================
# ACTUATOR & MONITORING
# ============================================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,threaddump,heapdump,configprops,loggers
management.endpoints.web.exposure.exclude=shutdown

# Health Check Details
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=db,redis
management.endpoint.health.group.liveness.include=diskSpace,ping
management.endpoint.health.group.ai.include=ai-service
management.health.mail.enabled=false

# Metrics Configuration
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.slo.http.server.requests=10ms,50ms,100ms,500ms,1s
management.metrics.web.server.request.autotime.enabled=true

# Thread Dump
management.endpoint.threaddump.enabled=true

# Heap Dump
management.endpoint.heapdump.enabled=true

# Loggers Management
management.endpoint.loggers.enabled=true

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.blooddonor=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type=OFF
logging.level.org.springframework.security=WARN
logging.level.org.springframework.cache=WARN
logging.level.org.springframework.data.redis=WARN
logging.level.com.zaxxer.hikari=WARN

# Log File Configuration
logging.file.name=/var/log/blood-donor/application.log
logging.file.path=/var/log/blood-donor
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.max-size=100MB
logging.logback.rollingpolicy.total-size-cap=10GB

# JSON Log Format (For production)
logging.pattern.file=%d{ISO8601} %5p ${hostName} --- [%20.20t] %-40.40c{1.} : %m%n%ex
logging.pattern.console=%clr(%d{ISO8601}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40c{1.}){cyan} %clr(:){faint} %m%n%ex

# ============================================
# ASYNC CONFIGURATION
# ============================================
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-thread-
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=30s

# ============================================
# SCHEDULER CONFIGURATION
# ============================================
spring.task.scheduling.pool.size=10
spring.task.scheduling.thread-name-prefix=scheduler-thread-
spring.task.scheduling.shutdown.await-termination=true

# ============================================
# FILE UPLOAD CONFIGURATION
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.location=/tmp/uploads
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-form-post-size=10MB

# ============================================
# INTERNATIONALIZATION
# ============================================
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600
spring.messages.fallback-to-system-locale=true

# ============================================
# SESSION MANAGEMENT
# ============================================
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.max-age=24h

# ============================================
# RESOURCE HANDLING
# ============================================
spring.web.resources.add-mappings=false
spring.web.resources.cache.period=31536000
spring.web.resources.chain.cache=true
spring.web.resources.chain.gzipped=true

# ============================================
# LOCALIZATION
# ============================================
spring.web.locale=IN
spring.web.locale-resolver=fixed

# ============================================
# DATASOURCE PROXY (for monitoring)
# ============================================
decorator.datasource.enabled=${DATASOURCE_PROXY_ENABLED:false}
decorator.datasource.p6spy.enabled=${P6SPY_ENABLED:false}

# ============================================
# DEVELOPMENT TOOLS (Disabled in Production)
# ============================================
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.devtools.add-properties=false

# ============================================
# CUSTOM APPLICATION PROPERTIES
# ============================================
# Blood Donor Specific
blood-donor.eligibility.days=90
blood-donor.max-donation-per-year=4
blood-donor.min-donation-age=18
blood-donor.max-donation-age=65
blood-donor.min-weight-kg=50
blood-donor.min-hemoglobin-level=12.5

# Emergency Request
emergency.max-radius-km=20
emergency.max-donors-notify=50
emergency.response-timeout-minutes=30
emergency.alert-cooldown-minutes=5

# Location Cache
location.cache.update-interval-minutes=5
location.cache.max-distance-km=50

# Analytics
analytics.window-days=30
analytics.prediction-horizon-days=7

# Notification
notification.retry.max-attempts=3
notification.retry.delay-seconds=30
notification.sms.enabled=true
notification.email.enabled=true
notification.push.enabled=true

# Rate Limiting
rate.limit.default.capacity=100
rate.limit.default.refill-interval=60
rate.limit.donor-search.capacity=50
rate.limit.emergency-request.capacity=10

# ============================================
# OPENTELEMETRY (Distributed Tracing)
# ============================================
otel.traces.exporter=jaeger
otel.metrics.exporter=none
otel.logs.exporter=none
otel.service.name=${spring.application.name}
otel.exporter.jaeger.endpoint=${JAEGER_ENDPOINT:http://localhost:14250}

# ============================================
# RESILIENCE4J (Circuit Breaker)
# ============================================
resilience4j.circuitbreaker.instances.ai-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.ai-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ai-service.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.ai-service.permitted-number-of-calls-in-half-open-state=5

resilience4j.retry.instances.ai-service.max-attempts=3
resilience4j.retry.instances.ai-service.wait-duration=1000

resilience4j.timelimiter.instances.ai-service.timeout-duration=5s

# ============================================
# PROMETHEUS PUSH GATEWAY
# ============================================
prometheus.pushgateway.enabled=${PROMETHEUS_ENABLED:false}
prometheus.pushgateway.url=${PROMETHEUS_URL:http://localhost:9091}
prometheus.pushgateway.job=${spring.application.name}
prometheus.pushgateway.push-interval=10s

# ============================================
# END OF CONFIGURATION
# ============================================
# Application property aliases used by @ConfigurationProperties classes
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
app.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}
app.ai-service.max-retries=${AI_SERVICE_MAX_RETRIES:3}
app.ai-service.api-key=${AI_SERVICE_API_KEY:}
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.phone-number=${TWILIO_PHONE_NUMBER:}
app.twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}
app.twilio.enabled=${TWILIO_ENABLED:false}
app.notification.enabled=${NOTIFICATION_ENABLED:true}
app.notification.sms.max-per-donor-per-day=${APP_NOTIFICATION_SMS_MAX_PER_DONOR_PER_DAY:3}
app.notification.sms.global-daily-cap=${APP_NOTIFICATION_SMS_GLOBAL_DAILY_CAP:500}
app.sms.templates.emergency=${SMS_EMERGENCY_TEMPLATE:%s: %s blood needed at %s, %s. Units: %d. Open app to respond: %s}
app.mail.from-name=${MAIL_FROM_NAME:Blood Donor Network}
app.admin.name=${ADMIN_NAME:Super Admin}
app.admin.email=${ADMIN_EMAIL:admin@blooddonor.com}
app.admin.phone=${ADMIN_PHONE:9999999999}
app.admin.password=${ADMIN_PASSWORD:}
app.mail.from-address=${MAIL_FROM_ADDRESS:noreply@blooddonor.com}
app.mail.reply-to=${MAIL_REPLY_TO:}

