# ==============================================================================
# INTEGRATION TEST PROFILE (Real MySQL 8 + Real Redis via Testcontainers)
# ==============================================================================

# Database
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.catalog=blood_donor_test

# JPA & Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis & Cache
spring.cache.type=redis
spring.cache.cache-names=donorSearch,activeRequests,stats,userProfiles
app.redis.cache.default-ttl-minutes=10
app.redis.cache.ttl-map.donorSearch=10
app.redis.cache.ttl-map.activeRequests=5
app.redis.cache.ttl-map.stats=15
app.redis.cache.ttl-map.userProfiles=30

# Rate Limiting
app.rate-limit.login.ip-max-attempts=50
app.rate-limit.login.ip-window-seconds=60
app.rate-limit.login.email-max-attempts=30
app.rate-limit.login.email-window-seconds=60

# JWT
jwt.secret=IntegrationTestSecretKeyThatIsAtLeast256BitsLongAndSecure12345!
jwt.expiration=86400000
jwt.refresh-expiration=604800000
app.jwt.secret=IntegrationTestSecretKeyThatIsAtLeast256BitsLongAndSecure12345!
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Email & Notifications
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
app.notification.enabled=false
app.twilio.account-sid=AC00000000000000000000000000000000
app.twilio.auth-token=00000000000000000000000000000000
app.twilio.phone-number=+10000000000
app.fcm.project-id=test-project
app.fcm.service-account=classpath:firebase-service-account.json
app.ai-service.url=http://localhost:8000
app.frontend.url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173,http://localhost:4000
app.reset-token.expiry-minutes=30

# Logging
logging.level.com.blood_donor=INFO
logging.level.org.flywaydb=INFO
logging.level.org.testcontainers=INFO
