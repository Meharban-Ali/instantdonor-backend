# ═══════════════════════════════════════════════
# DEVELOPMENT PROFILE
# Active: mvn spring-boot:run -Dspring.profiles.active=dev
# ═══════════════════════════════════════════════

# ── Database (Primary) ────────────────────────
spring.datasource.url=jdbc:h2:mem:blood_donor_db_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── Database (Replica) — locally same as primary
spring.datasource.replica.url=jdbc:h2:mem:blood_donor_db_test_rep;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.replica.driver-class-name=org.h2.Driver
spring.datasource.replica.username=sa
spring.datasource.replica.password=

# ── JPA ───────────────────────────────────────
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.hbm2ddl.auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

# ── Redis ─────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:12345}

# ── JWT ───────────────────────────────────────
jwt.secret=${JWT_SECRET:YourSuperSecretJWTKeyThatIsAtLeast256BitsLongAndSecure}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
app.jwt.secret=${JWT_SECRET:YourSuperSecretJWTKeyThatIsAtLeast256BitsLongAndSecure}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ── Email ─────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:test@test.com}
spring.mail.password=${MAIL_PASSWORD:testpass}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Twilio SMS ────────────────────────────────
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:ACxxxxxxxx}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:xxxxxxxx}
app.twilio.phone-number=${TWILIO_PHONE_NUMBER:+1234567890}

# ── Firebase FCM ──────────────────────────────
app.fcm.project-id=${FCM_PROJECT_ID:blood-donor-prod}
app.fcm.service-account=${FCM_SERVICE_ACCOUNT:classpath:firebase-service-account.json}

# ── AI Service ────────────────────────────────
app.ai-service.url=http://localhost:8000

# ── Frontend ──────────────────────────────────
app.frontend.url=http://localhost:5173

# ── CORS ──────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173,http://localhost:4000

# ── Notifications ─────────────────────────────
app.notification.enabled=true

# ── Token Expiry ──────────────────────────────
app.reset-token.expiry-minutes=30

# ── Swagger ───────────────────────────────────
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# ── Logging ───────────────────────────────────
logging.level.com.blooddonor=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG